[package]
name = "restyle"
version = "0.1.1"
edition = "2021"
description = "Restyle — rewrite the text you are typing with AI, in any app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
ts-rs = "10"
window-vibrancy = "0.6"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# native-tls = schannel: без aws-lc-sys (cmake/nasm) в сборке
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "charset", "json", "stream"] }
futures-util = "0.3.34"
keyring = "4.2.0"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

# Generic-код image (ресайз, JPEG) инстанцируется в нашем крейте, поэтому
# override только для зависимостей не помогает: в -O0 кодирование ~380 мс
# вместо ~30. opt-level=1 сохраняет отладку и убирает порядок.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
