[package]
name = "restyle-core"
version = "0.1.0"
edition = "2024"
description = "Restyle core: text capture, AI rewrite session, settings and history, without Tauri"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
ts-rs = "10"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# native-tls = schannel: без aws-lc-sys (cmake/nasm) в сборке
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "charset", "json", "stream"] }
futures-util = "0.3.34"
keyring = "4.2.0"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
